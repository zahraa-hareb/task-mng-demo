<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 380px;">
        <h3 class="mb-4 text-center">Task Manager</h3>

        <div th:if="${param.error}" class="alert alert-danger py-2">Invalid username or password.</div>
        <div th:if="${param.logout}" class="alert alert-success py-2">You have been logged out.</div>
        <div th:if="${param.registered}" class="alert alert-success py-2">Account created, please log in.</div>

        <!-- th:action adds the hidden _csrf token automatically -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign in</button>
        </form>

        <p class="mt-3 mb-0 text-center small">
            No account? <a th:href="@{/register}">Register</a>
        </p>
    </div>
</div>
</body>
</html>
