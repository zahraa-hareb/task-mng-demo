<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar bg-white border-bottom mb-4">
    <div class="container">
        <span class="navbar-brand">Admin View</span>
        <!-- Logout must be a POST with a CSRF token, not a plain link -->
        <form th:action="@{/logout}" method="post" class="mb-0">
            <a th:href="@{/tasks}" class="btn btn-outline-primary btn-sm me-2">Back to tasks</a>
            <span class="me-3">Hello, <strong sec:authentication="name"></strong></span>
            <button type="submit" class="btn btn-outline-secondary btn-sm">Logout</button>
        </form>
    </div>
</nav>

<div class="container" style="max-width: 720px;">
    <div class="card shadow-sm">
        <table class="table mb-0">
            <thead>
            <tr>
                <th>Id</th>
                <th>User Name</th>
                <th>Role</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${users}">
                <td th:text="${t.id}"></td>
                <td th:text="${t.username}"></td>
                <td th:text="${t.role}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(users)}">
                <td colspan="3" class="text-muted text-center">No users yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
