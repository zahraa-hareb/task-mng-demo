<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar bg-white border-bottom mb-4">
    <div class="container">
        <span class="navbar-brand">Task Manager</span>
        <!-- Logout must be a POST with a CSRF token, not a plain link -->
        <form th:action="@{/logout}" method="post" class="mb-0">
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="btn btn-warning btn-sm me-2">Admin</a>
            <span class="me-3">Hello, <strong sec:authentication="name"></strong></span>
            <button type="submit" class="btn btn-outline-secondary btn-sm">Logout</button>
        </form>
    </div>
</nav>

<div class="container" style="max-width: 720px;">
    <div class="card shadow-sm p-4 mb-4">
        <h5 class="mb-3">New task</h5>
        <form th:action="@{/tasks}" th:object="${task}" method="post">
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" id="title" th:field="*{title}" class="form-control" />
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea id="description" th:field="*{description}" class="form-control" rows="2"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Add Task</button>
        </form>
    </div>

    <div class="card shadow-sm">
        <table class="table mb-0">
            <thead>
            <tr>
                <th>Title</th>
                <th>Description</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${tasks}">
                <td th:text="${t.title}"></td>
                <td th:text="${t.description}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(tasks)}">
                <td colspan="2" class="text-muted text-center">No tasks yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
